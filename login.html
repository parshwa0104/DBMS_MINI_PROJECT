<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Grant Management System</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <span class="material-symbols-outlined" style="font-size: 2.5rem; color: #0369a1;">school</span>
                <h1>Research Grant<br>Management System</h1>
                <p class="login-subtitle">Sign in to access the dashboard</p>
            </div>

            <div id="loginAlert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">
                        <span class="material-symbols-outlined" style="font-size: 1rem; vertical-align: middle;">person</span>
                        Username
                    </label>
                    <input type="text" id="username" class="form-control" placeholder="Enter your username" required autofocus />
                </div>

                <div class="form-group">
                    <label for="password">
                        <span class="material-symbols-outlined" style="font-size: 1rem; vertical-align: middle;">lock</span>
                        Password
                    </label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required />
                </div>

                <button type="submit" class="btn btn-primary login-btn" id="loginBtn">
                    <span class="material-symbols-outlined" style="font-size: 1.1rem;">login</span>
                    Sign In
                </button>
            </form>

            <div class="login-footer">
                <p><strong>Demo Accounts:</strong></p>
                <table class="demo-accounts-table">
                    <tr><td>Admin</td><td><code>admin</code> / <code>admin123</code></td></tr>
                    <tr><td>Researcher</td><td><code>turing</code> / <code>researcher123</code></td></tr>
                    <tr><td>Faculty</td><td><code>dean_cse</code> / <code>faculty123</code></td></tr>
                </table>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
